name: Generate SEO Pages & Ping IndexNow

on:
  workflow_dispatch: # Позволяет запускать кнопкой вручную
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов для новых постов из Telegram-бота
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'generate-seo.mjs'

permissions:
  contents: write

jobs:
  build-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase client
        run: npm install --no-save @supabase/supabase-js

      - name: Generate HTML pages, Sitemap & Ping IndexNow
        run: node generate-seo.mjs

      - name: Commit and Push generated SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tool/ sitemap.xml robots.txt aiworkhub2026indexnowkey777.txt
          git diff --staged --quiet || git commit -m "Auto-update SEO pages and sitemap"
          git push
